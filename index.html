<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Firmas Virtual</title>
    <style>
        :root {
            --primary: #d4af37; /* Dorado */
            --dark: #111111;    /* Negro Fondo */
            --light: #1a1a1a;   /* Tarjetas */
            --text-color: #ffffff;
            --input-bg: #252525;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #161616;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            box-sizing: border-box;
            color: var(--text-color);
            font-size: 1rem;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px dashed #444;
            border-radius: 8px;
            box-sizing: border-box;
            color: #aaa;
            cursor: pointer;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: var(--dark);
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #bfa030;
            transform: translateY(-1px);
        }
        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        .firmas-container {
            margin-top: 30px;
        }
        .firmas-container h2 {
            color: var(--primary);
            font-family: 'Georgia', serif;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }
        .firma-card {
            background: var(--light);
            border-left: 5px solid var(--primary);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .firma-card h3 {
            margin: 0 0 8px 0;
            color: var(--primary);
            font-size: 1.15rem;
        }
        .firma-card p {
            margin: 0 0 12px 0;
            line-height: 1.5;
            color: #e0e0e0;
        }
        .firma-img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            object-fit: cover;
            display: block;
            margin-top: 12px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        #cargando {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✒️ Libro de Firmas</h1>
    
    <form id="firmaForm">
        <div class="form-group">
            <label for="nombre">Tu Nombre:</label>
            <input type="text" id="nombre" required placeholder="Ej. María García">
        </div>
        <div class="form-group">
            <label for="mensaje">Tu Mensaje o Dedicatoria:</label>
            <textarea id="mensaje" required placeholder="¡Felicidades en tu día!..."></textarea>
        </div>
        <div class="form-group">
            <label for="foto">Sube una Foto:</label>
            <input type="file" id="foto" accept="image/*">
        </div>
        <button type="submit" id="btnEnviar">Publicar Firma</button>
    </form>

    <div class="firmas-container" id="firmasLista">
        <h2>Mensajes de los invitados</h2>
        <div id="cargando">Cargando mensajes...</div>
    </div>
</div>

<script>
    // Configuración directa y segura
    const SUPABASE_URL = "https://mzyhztofjecwsodvxgjz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16eWh6dG9famVjd3NvZHZ4Z2p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTM5MTAsImV4cCI6MjEwNjg2OTkxMH0.tA-yKcZEsFc4Dc7lqtUHHKMIMtfS9nR9lKdTN5WweVM";

    const form = document.getElementById('firmaForm');
    const lista = document.getElementById('firmasLista');
    const btnEnviar = document.getElementById('btnEnviar');

    // Conexión nativa mediante FETCH (Evita usar la librería externa que se bloqueaba)
    document.addEventListener('DOMContentLoaded', () => {
        cargarFirmas();
        // Recargar las firmas automáticamente cada 10 segundos por si alguien más escribe
        setInterval(cargarFirmas, 10000);
    });

    async function cargarFirmas() {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/firmas?select=*&order=id.desc`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error('Error en la base de datos');
            const data = await response.json();

            lista.innerHTML = '<h2>Mensajes de los invitados</h2>';
            if (!data || data.length === 0) {
                lista.innerHTML += '<p id="sin-firmas" style="color: #7f8c8d;">Aún no hay firmas. ¡Sé el primero!</p>';
                return;
            }

            data.forEach(firma => {
                const card = document.createElement('div');
                card.className = 'firma-card';
                
                let fotoHtml = '';
                if (firma.foto) {
                    fotoHtml = `<img src="${firma.foto}" class="firma-img" alt="Foto de ${firma.nombre}">`;
                }

                card.innerHTML = `
                    <h3>${escapeHTML(firma.nombre)}</h3>
                    <p>${escapeHTML(firma.mensaje).replace(/\n/g, '<br>')}</p>
                    ${fotoHtml}
                `;
                lista.appendChild(card);
            });
        } catch (error) {
            console.error(error);
            lista.innerHTML = '<h2>Mensajes de los invitados</h2><p>Error al conectar con la base de datos.</p>';
        }
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        btnEnviar.disabled = true;
        btnEnviar.innerText = "Publicando...";
        
        const nombre = document.getElementById('nombre').value;
        const mensaje = document.getElementById('mensaje').value;
        const fotoInput = document.getElementById('foto');
        
        let fotoBase64 = null;

        if (fotoInput.files && fotoInput.files[0]) {
            fotoBase64 = await convertToBase64(fotoInput.files[0]);
        }

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/firmas`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({ nombre, mensaje, foto: fotoBase64 })
            });

            if (!response.ok) throw new Error('No se pudo guardar la firma');
            
            form.reset();
            cargarFirmas();
        } catch (error) {
            console.error(error);
            alert("Hubo un problema al publicar tu firma. Verifica que el RLS esté desactivado en Supabase.");
        } finally {
            btnEnviar.disabled = false;
            btnEnviar.innerText = "Publicar Firma";
        }
    });

    function convertToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
