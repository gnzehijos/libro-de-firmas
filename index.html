<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libro de Firmas Virtual</title>

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f4d875;
            --gold-dark: #9c7c19;

            --black: #050505;
            --black-soft: #0d0d0d;
            --black-card: #111111;

            --white: #ffffff;
            --gray: #b8b8b8;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: var(--white);

            background:
                radial-gradient(
                    circle at top,
                    rgba(212, 175, 55, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #000000 0%,
                    #090909 50%,
                    #000000 100%
                );

            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;
        }

        .container {
            position: relative;

            max-width: 650px;
            width: 100%;

            margin: 0 auto;

            padding: 35px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,20,20,0.98),
                    rgba(5,5,5,0.98)
                );

            border: 1px solid rgba(212,175,55,0.45);

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.7),
                0 0 40px rgba(212,175,55,0.08);

            overflow: hidden;
        }

        .container::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    var(--gold-light),
                    var(--gold),
                    transparent
                );
        }

        /* =========================
           TITULO
        ========================= */

        h1 {
            margin: 0 0 10px;

            text-align: center;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(30px, 6vw, 42px);

            color: var(--gold-light);

            letter-spacing: 1px;

            text-shadow:
                0 0 10px rgba(212,175,55,0.25),
                0 0 25px rgba(212,175,55,0.12);
        }

        .subtitle {
            margin: 0 0 30px;

            text-align: center;

            color: var(--gray);

            font-size: 14px;

            letter-spacing: 1px;
        }

        .gold-line {
            width: 100px;
            height: 2px;

            margin: 0 auto 30px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    transparent
                );
        }

        /* =========================
           FORMULARIO
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: var(--gold-light);

            font-weight: 600;

            font-size: 14px;

            letter-spacing: 0.5px;
        }

        input[type="text"],
        textarea,
        input[type="file"] {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid rgba(212,175,55,0.35);

            border-radius: 10px;

            background: #090909;

            color: white;

            font-family: inherit;

            outline: none;

            transition:
                border-color 0.25s,
                box-shadow 0.25s,
                transform 0.25s;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #777;
        }

        input[type="text"]:focus,
        textarea:focus,
        input[type="file"]:focus {

            border-color: var(--gold);

            box-shadow:
                0 0 0 3px rgba(212,175,55,0.10),
                0 0 20px rgba(212,175,55,0.08);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        input[type="file"] {
            cursor: pointer;
            padding: 10px;
        }

        input[type="file"]::file-selector-button {
            margin-right: 10px;

            padding: 8px 12px;

            border: 1px solid var(--gold);

            border-radius: 7px;

            background: var(--gold);

            color: #000;

            font-weight: bold;

            cursor: pointer;
        }

        /* =========================
           INFORMACION FOTO
        ========================= */

        .foto-info {
            display: none;

            margin-top: 8px;

            padding: 9px 12px;

            border-left: 3px solid var(--gold);

            background: rgba(212,175,55,0.07);

            border-radius: 5px;

            color: #d0d0d0;

            font-size: 12px;

            line-height: 1.5;
        }

        .foto-info.visible {
            display: block;
        }

        .foto-info strong {
            color: var(--gold-light);
        }

        /* =========================
           BOTON
        ========================= */

        button {
            position: relative;

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--gold-dark),
                    var(--gold),
                    var(--gold-light),
                    var(--gold)
                );

            background-size: 200% 200%;

            color: #050505;

            font-size: 16px;

            font-weight: 800;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition:
                transform 0.25s,
                box-shadow 0.25s,
                background-position 0.5s;

            box-shadow:
                0 5px 20px rgba(212,175,55,0.15);
        }

        button:hover {
            transform: translateY(-2px);

            background-position: 100% 50%;

            box-shadow:
                0 8px 30px rgba(212,175,55,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           SECCION FIRMAS
        ========================= */

        .firmas-container {
            margin-top: 45px;
        }

        .firmas-container > h2 {
            position: relative;

            margin: 0 0 20px;

            padding-bottom: 12px;

            color: var(--gold-light);

            font-family: Georgia, "Times New Roman", serif;

            font-size: 24px;
        }

        .firmas-container > h2::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 0;

            width: 70px;
            height: 2px;

            background: var(--gold);
        }

        /* =========================
           CARD FIRMA
        ========================= */

        .firma-card {
            position: relative;

            margin-bottom: 18px;

            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0b0b0b
                );

            border: 1px solid rgba(212,175,55,0.22);

            border-left: 4px solid var(--gold);

            border-radius: 0 12px 12px 0;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.35);

            transition:
                transform 0.25s,
                border-color 0.25s,
                box-shadow 0.25s;

            animation: aparecer 0.45s ease;
        }

        .firma-card:hover {
            transform: translateY(-2px);

            border-color:
                rgba(212,175,55,0.5);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.45),
                0 0 20px rgba(212,175,55,0.05);
        }

        .firma-card h3 {
            margin: 0 0 8px;

            color: var(--gold-light);

            font-size: 18px;
        }

        .firma-card p {
            margin: 0 0 14px;

            color: #dedede;

            line-height: 1.6;

            white-space: normal;

            word-break: break-word;
        }

        .firma-img {
            display: block;

            width: 100%;
            max-width: 100%;

            max-height: 400px;

            object-fit: cover;

            margin-top: 12px;

            border-radius: 10px;

            border: 1px solid rgba(212,175,55,0.3);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.4);
        }

        /* =========================
           CARGANDO / VACIO
        ========================= */

        #cargando {
            padding: 20px;

            text-align: center;

            color: #888;

            font-size: 14px;
        }

        .sin-firmas {
            padding: 20px;

            text-align: center;

            color: #888;
        }

        .error-mensaje {
            padding: 15px;

            border: 1px solid rgba(231,76,60,0.4);

            border-radius: 8px;

            color: #ff8a80;

            background: rgba(231,76,60,0.07);
        }

        /* =========================
           ANIMACIONES
        ========================= */

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
            }

            .container {
                padding: 25px 18px;

                border-radius: 16px;
            }

            h1 {
                font-size: 30px;
            }

            .firma-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✒️ Libro de Firmas</h1>

    <p class="subtitle">
        Dejá tu mensaje y un recuerdo para siempre
    </p>

    <div class="gold-line"></div>

    <form id="firmaForm">

        <div class="form-group">

            <label for="nombre">
                Tu Nombre
            </label>

            <input
                type="text"
                id="nombre"
                required
                maxlength="80"
                placeholder="Ej. María García"
            >

        </div>


        <div class="form-group">

            <label for="mensaje">
                Tu Mensaje o Dedicatoria
            </label>

            <textarea
                id="mensaje"
                required
                maxlength="1000"
                placeholder="¡Felicidades en tu día!..."
            ></textarea>

        </div>


        <div class="form-group">

            <label for="foto">
                📸 Subí una Foto
            </label>

            <input
                type="file"
                id="foto"
                accept="image/*"
            >

            <div id="fotoInfo" class="foto-info"></div>

        </div>


        <button
            type="submit"
            id="btnEnviar"
        >
            ✨ Publicar Firma
        </button>

    </form>


    <div
        class="firmas-container"
        id="firmasLista"
    >

        <h2>
            Mensajes de los invitados
        </h2>

        <div id="cargando">
            Cargando mensajes...
        </div>

    </div>

</div>


<script>

    /* =========================================================
       CONFIGURACIÓN SUPABASE
    ========================================================= */

    const SUPABASE_URL =
        "https://mzyhztofjecwsodvxgjz.supabase.co";

    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16eWh6dG9mamVjd3NvZHZ4Z2p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTM5MTAsImV4cCI6MjEwNjg2OTkxMH0.tA-yKcZEsFc4Dc7lqtUHHKMIMtfS9nR9lKdTN5WweVM";


    /* =========================================================
       CONFIGURACIÓN DE COMPRESIÓN
    ========================================================= */

    // Tamaño máximo aproximado que intentaremos conseguir.
    const MAX_IMAGE_SIZE = 800 * 1024; // 800 KB

    // Resolución máxima.
    const MAX_IMAGE_WIDTH = 1600;
    const MAX_IMAGE_HEIGHT = 1600;

    // Calidad inicial del JPG.
    const INITIAL_QUALITY = 0.75;


    /* =========================================================
       ELEMENTOS
    ========================================================= */

    const form =
        document.getElementById("firmaForm");

    const lista =
        document.getElementById("firmasLista");

    const btnEnviar =
        document.getElementById("btnEnviar");

    const fotoInput =
        document.getElementById("foto");

    const fotoInfo =
        document.getElementById("fotoInfo");


    /* =========================================================
       CARGAR FIRMAS AL INICIAR
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            cargarFirmas();

            // Actualizar cada 10 segundos
            setInterval(
                cargarFirmas,
                10000
            );

        }
    );


    /* =========================================================
       MOSTRAR INFORMACIÓN DE LA FOTO
    ========================================================= */

    fotoInput.addEventListener(
        "change",
        async () => {

            if (
                !fotoInput.files ||
                !fotoInput.files[0]
            ) {

                fotoInfo.classList.remove("visible");

                return;
            }

            const file =
                fotoInput.files[0];

            const originalSize =
                formatBytes(file.size);

            fotoInfo.innerHTML = `
                <strong>Foto seleccionada:</strong>
                ${escapeHTML(file.name)}
                <br>
                <strong>Tamaño original:</strong>
                ${originalSize}
                <br>
                <span>
                    ✓ Se comprimirá automáticamente antes de publicarla.
                </span>
            `;

            fotoInfo.classList.add("visible");
        }
    );


    /* =========================================================
       CARGAR FIRMAS DESDE SUPABASE
    ========================================================= */

    async function cargarFirmas() {

        try {

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/firmas?select=*&order=id.desc`,
                    {
                        method: "GET",

                        headers: {
                            "apikey":
                                SUPABASE_ANON_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_ANON_KEY}`,

                            "Content-Type":
                                "application/json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Error en la base de datos"
                );

            }


            const data =
                await response.json();


            lista.innerHTML = `
                <h2>
                    Mensajes de los invitados
                </h2>
            `;


            if (
                !data ||
                data.length === 0
            ) {

                lista.innerHTML += `
                    <p class="sin-firmas">
                        Aún no hay firmas.
                        ¡Sé el primero! ✨
                    </p>
                `;

                return;
            }


            data.forEach(
                firma => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "firma-card";


                    let fotoHtml = "";


                    if (firma.foto) {

                        fotoHtml = `
                            <img
                                src="${firma.foto}"
                                class="firma-img"
                                alt="Foto de ${escapeHTML(firma.nombre)}"
                                loading="lazy"
                            >
                        `;

                    }


                    card.innerHTML = `

                        <h3>
                            ${escapeHTML(firma.nombre)}
                        </h3>

                        <p>
                            ${escapeHTML(
                                firma.mensaje || ""
                            ).replace(
                                /\n/g,
                                "<br>"
                            )}
                        </p>

                        ${fotoHtml}

                    `;


                    lista.appendChild(card);

                }
            );

        }

        catch (error) {

            console.error(error);

            lista.innerHTML = `

                <h2>
                    Mensajes de los invitados
                </h2>

                <p class="error-mensaje">
                    No se pudieron cargar los mensajes.
                    Intentá nuevamente en unos segundos.
                </p>

            `;

        }

    }


    /* =========================================================
       PUBLICAR FIRMA
    ========================================================= */

    form.addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            btnEnviar.disabled = true;

            btnEnviar.innerText =
                "Comprimiendo y publicando...";


            const nombre =
                document
                    .getElementById("nombre")
                    .value
                    .trim();


            const mensaje =
                document
                    .getElementById("mensaje")
                    .value
                    .trim();


            const fotoFile =
                fotoInput.files &&
                fotoInput.files[0];


            let fotoBase64 = null;


            try {

                /* -----------------------------------------
                   COMPRIMIR FOTO
                ----------------------------------------- */

                if (fotoFile) {

                    fotoBase64 =
                        await comprimirImagen(
                            fotoFile
                        );

                }


                /* -----------------------------------------
                   ENVIAR A SUPABASE
                ----------------------------------------- */

                btnEnviar.innerText =
                    "Publicando...";


                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/firmas`,
                        {
                            method: "POST",

                            headers: {

                                "apikey":
                                    SUPABASE_ANON_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_ANON_KEY}`,

                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=representation"
                            },

                            body: JSON.stringify({
                                nombre,
                                mensaje,
                                foto: fotoBase64
                            })
                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "Supabase:",
                        errorText
                    );

                    throw new Error(
                        "No se pudo guardar la firma"
                    );

                }


                /* -----------------------------------------
                   TODO OK
                ----------------------------------------- */

                form.reset();

                fotoInfo.classList.remove(
                    "visible"
                );

                await cargarFirmas();

                alert(
                    "✨ ¡Tu firma fue publicada correctamente!"
                );

            }

            catch (error) {

                console.error(error);

                alert(
                    "Hubo un problema al publicar tu firma.\n\n" +
                    "Si el problema continúa, revisá las políticas RLS de Supabase."
                );

            }

            finally {

                btnEnviar.disabled = false;

                btnEnviar.innerText =
                    "✨ Publicar Firma";

            }

        }
    );


    /* =========================================================
       COMPRESOR DE IMÁGENES
    ========================================================= */

    async function comprimirImagen(file) {

        return new Promise(
            (resolve, reject) => {

                const reader =
                    new FileReader();


                reader.onload =
                    function(event) {

                        const img =
                            new Image();


                        img.onload =
                            function() {

                                try {

                                    /* --------------------------------
                                       CALCULAR NUEVAS DIMENSIONES
                                    -------------------------------- */

                                    let width =
                                        img.width;

                                    let height =
                                        img.height;


                                    const scale =
                                        Math.min(
                                            MAX_IMAGE_WIDTH / width,
                                            MAX_IMAGE_HEIGHT / height,
                                            1
                                        );


                                    width =
                                        Math.round(
                                            width * scale
                                        );


                                    height =
                                        Math.round(
                                            height * scale
                                        );


                                    /* --------------------------------
                                       CREAR CANVAS
                                    -------------------------------- */

                                    const canvas =
                                        document.createElement(
                                            "canvas"
                                        );


                                    canvas.width =
                                        width;

                                    canvas.height =
                                        height;


                                    const ctx =
                                        canvas.getContext(
                                            "2d"
                                        );


                                    /*
                                     * Fondo blanco.
                                     *
                                     * Esto evita problemas si
                                     * la imagen original es PNG
                                     * transparente.
                                     */

                                    ctx.fillStyle =
                                        "#ffffff";

                                    ctx.fillRect(
                                        0,
                                        0,
                                        width,
                                        height
                                    );


                                    ctx.drawImage(
                                        img,
                                        0,
                                        0,
                                        width,
                                        height
                                    );


                                    /* --------------------------------
                                       COMPRIMIR
                                    -------------------------------- */

                                    let quality =
                                        INITIAL_QUALITY;

                                    let base64 =
                                        canvas.toDataURL(
                                            "image/jpeg",
                                            quality
                                        );


                                    /*
                                     * Si todavía pesa demasiado,
                                     * vamos bajando la calidad.
                                     */

                                    while (
                                        getBase64Size(base64)
                                        > MAX_IMAGE_SIZE
                                        &&
                                        quality > 0.35
                                    ) {

                                        quality -= 0.05;

                                        base64 =
                                            canvas.toDataURL(
                                                "image/jpeg",
                                                quality
                                            );

                                    }


                                    /*
                                     * Si aun así supera el límite,
                                     * reducimos resolución.
                                     */

                                    if (
                                        getBase64Size(base64)
                                        > MAX_IMAGE_SIZE
                                    ) {

                                        const smallerCanvas =
                                            document.createElement(
                                                "canvas"
                                            );


                                        const smallerWidth =
                                            Math.round(
                                                width * 0.75
                                            );

                                        const smallerHeight =
                                            Math.round(
                                                height * 0.75
                                            );


                                        smallerCanvas.width =
                                            smallerWidth;

                                        smallerCanvas.height =
                                            smallerHeight;


                                        const smallerCtx =
                                            smallerCanvas.getContext(
                                                "2d"
                                            );


                                        smallerCtx.drawImage(
                                            canvas,
                                            0,
                                            0,
                                            smallerWidth,
                                            smallerHeight
                                        );


                                        base64 =
                                            smallerCanvas.toDataURL(
                                                "image/jpeg",
                                                0.65
                                            );

                                    }


                                    /* --------------------------------
                                       INFORMACIÓN FINAL
                                    -------------------------------- */

                                    const finalSize =
                                        getBase64Size(
                                            base64
                                        );


                                    fotoInfo.innerHTML = `

                                        <strong>
                                            ✓ Foto optimizada
                                        </strong>

                                        <br>

                                        Tamaño original:
                                        ${formatBytes(file.size)}

                                        <br>

                                        Tamaño final:
                                        ${formatBytes(finalSize)}

                                        <br>

                                        Resolución:
                                        ${width} × ${height}px

                                    `;

                                    fotoInfo.classList.add(
                                        "visible"
                                    );


                                    resolve(base64);

                                }

                                catch (error) {

                                    reject(error);

                                }

                            };


                        img.onerror =
                            function() {

                                reject(
                                    new Error(
                                        "No se pudo procesar la imagen."
                                    )
                                );

                            };


                        img.src =
                            event.target.result;

                    };


                reader.onerror =
                    function() {

                        reject(
                            new Error(
                                "No se pudo leer la imagen."
                            )
                        );

                    };


                reader.readAsDataURL(file);

            }
        );

    }


    /* =========================================================
       CALCULAR TAMAÑO REAL DEL BASE64
    ========================================================= */

    function getBase64Size(base64) {

        const stringLength =
            base64.length -
            base64.indexOf(",") -
            1;


        return Math.floor(
            stringLength * 0.75
        );

    }


    /* =========================================================
       FORMATEAR BYTES
    ========================================================= */

    function formatBytes(bytes) {

        if (bytes === 0) {
            return "0 Bytes";
        }


        const units = [
            "Bytes",
            "KB",
            "MB",
            "GB"
        ];


        const i =
            Math.floor(
                Math.log(bytes) /
                Math.log(1024)
            );


        return (
            parseFloat(
                (
                    bytes /
                    Math.pow(1024, i)
                ).toFixed(2)
            )
            +
            " "
            +
            units[i]
        );

    }


    /* =========================================================
       PROTECCIÓN CONTRA HTML
    ========================================================= */

    function escapeHTML(str) {

        return String(str).replace(
            /[&<>'"]/g,

            tag => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;"
            }[tag])
        );

    }

</script>

</body>
</html>
